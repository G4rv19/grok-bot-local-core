<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Grok Bot Local</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Grok Bot <span>Local</span></div>
      <div class="list-heading"><h2>Bots</h2><button id="new-bot" aria-label="New Bot" title="New Bot">+</button></div>
      <nav id="bots" aria-label="Bots"></nav>
      <div class="sidebar-footer">
        <button id="connections">Connections</button>
        <button id="settings">Settings</button>
      </div>
    </aside>
    <main class="chat">
      <header class="chat-header">
        <div><h1 id="bot-name">Assistant</h1><p id="activity">Ready</p></div>
        <div class="header-actions">
          <button id="edit-bot">Edit Bot</button>
          <button id="workspace">Workspace</button>
          <button id="new-chat">New chat</button>
          <button id="toggle-work" class="primary" aria-expanded="false">Tasks</button>
        </div>
      </header>
      <section id="transcript" aria-label="Conversation" aria-live="polite"></section>
      <form id="composer" class="composer">
        <div id="attachments" class="attachments"></div>
        <label class="sr-only" for="prompt">Message</label>
        <textarea id="prompt" rows="2" placeholder="Message your Bot" maxlength="200000"></textarea>
        <div class="composer-actions">
          <button id="attach" type="button">Attach files</button>
          <button id="stop" type="button" hidden>Stop</button>
          <button id="send" class="primary" type="submit">Send</button>
        </div>
      </form>
      <p id="notice" role="status" hidden></p>
    </main>
    <aside id="work" class="work" hidden aria-label="Tasks and schedules">
      <div class="list-heading"><h2>Tasks &amp; schedules</h2><button id="close-work" aria-label="Close tasks">×</button></div>
      <div class="work-actions"><button id="new-task" class="primary">New task</button><button id="new-schedule">New schedule</button></div>
      <div id="work-items"></div>
    </aside>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">×</button></div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
